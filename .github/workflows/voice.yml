name: O'zbekcha ovozni yaratish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/audio/clips.json
      - scripts/gen_voice.py

permissions:
  contents: write

concurrency:
  group: voice
  cancel-in-progress: false

jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts==7.3.1
      - run: python scripts/gen_voice.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add public/audio
          if git diff --cached --quiet; then echo "O'zgarish yo'q"; exit 0; fi
          git commit -m "Ovoz fayllarini yangilash"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
